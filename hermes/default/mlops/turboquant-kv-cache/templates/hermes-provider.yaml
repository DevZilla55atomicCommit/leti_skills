# TurboQuant Hermes Provider Configuration
# Paste into ~/.hermes/config.yaml under providers:

providers:
  turboquant:
    api: http://localhost:8081/v1
    api_key: "not-needed"
    default_model: gemma4-12b-turbo
    models:
      - gemma4-12b-turbo
    name: "TurboQuant"
    context_length: 32768

