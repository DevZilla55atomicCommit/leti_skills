# Processing
batch_size: 10
max_concurrent: 3
timeout_seconds: 120

# Effect Categories with keyword matching
categories:
  - name: "Transitions"
    keywords: ["cut out", "whip pan", "match cut", "morph", "dissolve", "wipe", "slide", "push", "iris"]
    folder: "transitions"
  - name: "Compositing"
    keywords: ["green screen", "rotoscope", "matte", "keying", "alpha", "chroma key", "luma key"]
    folder: "compositing"
  - name: "Motion Graphics"
    keywords: ["lower third", "kinetic type", "title", "lowerthird", "animated text", "callout"]
    folder: "motion-graphics"
  - name: "VFX"
    keywords: ["particles", "explosion", "fire", "smoke", "sci-fi", "energy", "magic", "portal"]
    folder: "vfx"
  - name: "Text Effects"
    keywords: ["kinetic type", "3d text", "callout", "subtitle style", "typewriter"]
    folder: "text-effects"
  - name: "Stylization"
    keywords: ["glitch", "vhs", "film damage", "halation", "film burn", "light leaks", "crt"]
    folder: "stylization"
  - name: "Time Effects"
    keywords: ["speed ramp", "time remap", "freeze frame", "slo-mo", "frame blend"]
    folder: "time-effects"

# Skip patterns (promo, meme, non-DaVinci, etc.)
skip_patterns:
  - "promo"
  - "preset pack"
  - "lightroom"
  - "meme"
  - "magimir"
  - "mobile"
  - "app"
  - "smartphone"
