## Skill Inheritance Rules

1. **Wildcards work**: `davinci-resolve/*` matches all skills under that prefix
2. **Explicit > implicit**: List critical skills explicitly; wildcards for bulk
3. **No circular deps**: Agent skills must not create circular dependencies
4. **Version pin**: Note skill versions if breaking changes are possible