# Agent Squad Template — Reusable Definition

*Use this template to define new agent squads. Copy and modify for each project/session.*

---

## Squad Definition Schema

```yaml
# Required fields for each agent
agents:
  - name: string              # Unique agent identifier (kebab-case)
    domain: string            # Human-readable domain description
    model: string             # Model assignment (support primary/fallback)
    tools: string[]           # Tool names from Hermes toolset
    skills: string[]          # Skill names (support wildcards: davinci-resolve/*)
    prompt_focus: string      # Core instruction added to agent's system prompt
    # Optional:
    # fallback_model: string   # Fallback if primary unavailable
    # priority: integer        # Delegation priority (lower = first)
    # max_concurrent: integer  # Max parallel tasks for this agent
```

