## Adding New Agents

### Checklist

- [ ] Domain doesn't overlap existing agents
- [ ] Model assignment matches workload (see model-capability-matrix.md)
- [ ] Tool set is minimal for domain (security + focus)
- [ ] Skills exist or are documented for creation
- [ ] Prompt focus is specific and actionable
- [ ] Delegation patterns documented for common workflows

### Example: Adding a "DevOps Engineer" Agent

```yaml
  - name: devops-engineer
    domain: "CI/CD, infrastructure, deployment, monitoring"
    model: "qwen3.5:4b (local) / nemotron-3-ultra:cloud (complex)"
    tools:
      - terminal
      - read_file
      - write_file
      - patch
      - search_files
      - git
      - github
    skills:
      - devops/*
      - macos-launch-agent-management
      - cron-job-validation
      - disk-space-monitoring
      - hermes-profile-sync-management
    prompt_focus: "Infrastructure as code, automated deployments, monitoring/alerting. Terminal-first, reproducible configs."
```

