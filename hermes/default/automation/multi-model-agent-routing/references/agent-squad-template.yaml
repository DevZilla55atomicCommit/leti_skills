## Delegation Patterns

### Parallel (Independent Domains)

```python
delegate_task(tasks=[
    {"goal": "Grade clip C001 with teal-orange look", "context": "...", "role": "leaf"},  # → video-grader
    {"goal": "Build Next.js component for video gallery", "context": "...", "role": "leaf"},  # → code-architect
    {"goal": "Create storyboard for product launch video", "context": "...", "role": "leaf"},  # → creative-director
])
```

### Sequential (Dependent Workflow)

```python
# 1. creative-director → creative brief
brief = delegate_task(goal="Create creative brief for product launch video", ...)

# 2. code-architect → delivery tool
tool = delegate_task(goal="Build video gallery component per brief", context=brief, ...)

# 3. video-grader → grade assets
graded = delegate_task(goal="Grade 5 clips per brief look", context=brief, ...)

# 4. code-architect → integrate
delegate_task(goal="Integrate graded clips into gallery", context={"brief": brief, "clips": graded}, ...)
```

### Hybrid (Creative Brief → Parallel Execution → Integration)

```python
# Phase 1: Creative direction (single agent)
brief = delegate_task(goal="Design visual system for portfolio site", role="leaf")  # creative-director

# Phase 2: Parallel build (multiple agents)
results = delegate_task(tasks=[
    {"goal": "Build Next.js portfolio per brief", "context": brief, "role": "leaf"},  # code-architect
    {"goal": "Grade hero video clips per brief", "context": brief, "role": "leaf"},    # video-grader
    {"goal": "Create storyboard for case study videos", "context": brief, "role": "leaf"},  # creative-director
])

# Phase 3: Integration (single agent)
delegate_task(goal="Assemble portfolio with graded video + storyboard", context={"brief": brief, "results": results}, role="leaf")  # code-architect
```

