# Skip patterns (promo, meme, non-educational, etc.)
skip_patterns:
  - "promo"
  - "preset pack"
  - "meme"
  - "joke"
  - "funny"
  - "parody"
  - "not educational"
  - "no tutorial"
  - "just for fun"

# Output exports
exports:
  - knowledge_base_export.json
  - knowledge_base_export.csv
  - skills_export.json
  - skills_export.csv
  - ARCHITECTURE_DIAGRAM.md
  - ARCHITECTURE_DIAGRAM_INTERACTIVE.html

# Skill naming
skill_naming:
  prefix: "davinci-resolve-"
  separator: "-"
  lowercase: true
  max_length: 80

# Vault file naming
vault_naming:
  format: "{NN}-{Title}_{Creator}_{Keywords}.md"
  max_title_words: 8
  separator: "_"

# Browser settings
browser:
  headless: true
  viewport_width: 1920
  viewport_height: 1080
  wait_for_network_idle: true
  screenshot_on_error: true

# Retry policy
retry:
  max_attempts: 3
  backoff_base: 2
  backoff_max: 30
  retry_on:
    - "timeout"
    - "network_error"
    - "element_not_found"
    - "rate_limit"