<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2c5f7c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Come Follow Me: "[LESSON_TITLE]" - [SCRIPTURE_REFERENCES]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        /* ========================================
           CSS CUSTOM PROPERTIES (THEME SYSTEM)
           ======================================== */
        :root {
            /* Light Theme (Default) - Warm, inviting palette */
            --bg-primary: #faf8f3;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0ebe0;
            --bg-card: #ffffff;
            --bg-toolbar: rgba(255, 253, 248, 0.98);
            --text-primary: #1d3a4a;
            --text-secondary: #2d5a6e;
            --text-muted: #6b8a9a;
            --text-on-accent: #ffffff;
            --accent-primary: #c8962e;
            --accent-secondary: #b88628;
            --accent-light: #fef3e0;
            --accent-warm: #e8c547;
            --accent-coral: #d47a2e;
            --accent-teal: #2a8a7a;
            --accent-sage: #7a9a5a;
            --border-color: #e5dbc8;
            --shadow-sm: 0 1px 3px rgba(29, 58, 74, 0.08);
            --shadow-md: 0 4px 16px rgba(29, 58, 74, 0.1);
            --shadow-lg: 0 12px 32px rgba(29, 58, 74, 0.15);
            --shadow-xl: 0 20px 48px rgba(29, 58, 74, 0.18);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --font-base: 16px;
            --font-sm: 14px;
            --font-lg: 18px;
            --font-xl: 22px;
            --font-2xl: 30px;
            --font-3xl: 38px;
            --line-height: 1.75;
            --tap-target: 48px;
            --toolbar-height: 64px;
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0d1b2a;
            --bg-secondary: #152538;
            --bg-tertiary: #1c3044;
            --bg-card: #1a2d3e;
            --bg-toolbar: rgba(13, 27, 42, 0.98);
            --text-primary: #f0f4f7;
            --text-secondary: #b8d0e0;
            --text-muted: #7a9bae;
            --text-on-accent: #0d1b2a;
            --accent-primary: #e8c547;
            --accent-secondary: #d4b042;
            --accent-light: #2a2a1a;
            --accent-warm: #e8b83a;
            --accent-coral: #e88a4a;
            --accent-teal: #3fc9b8;
            --accent-sage: #9ac97a;
            --border-color: #2a3f4a;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
            --shadow-xl: 0 20px 48px rgba(0,0,0,0.6);
        }

        /* ========================================
           RESET & BASE
           ======================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: var(--font-base);
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        @media (min-width: 375px) {
            html { font-size: 17px; }
        }

        @media (min-width: 428px) {
            html { font-size: 18px; }
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: var(--line-height);
            color: var(--text-primary);
            background: var(--bg-primary);
            min-height: 100vh;
            padding-bottom: calc(var(--toolbar-height) + env(safe-area-inset-bottom) + 32px);
            transition: background-color var(--transition-normal), color var(--transition-normal);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle background pattern for visual interest */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(200, 165, 46, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(42, 138, 122, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        [data-theme="dark"] body::before {
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(232, 197, 71, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(63, 201, 184, 0.04) 0%, transparent 50%);
        }

        /* ========================================
           STICKY TOOLBAR
           ======================================== */
        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--toolbar-height);
            background: var(--bg-toolbar);
            backdrop-filter: saturate(180%) blur(24px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        .toolbar-left, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: var(--tap-target);
            height: var(--tap-target);
            min-width: var(--tap-target);
            border: none;
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            transition: all var(--transition-fast);
            -webkit-tap-highlight-color: transparent;
        }

        .toolbar-btn:active {
            transform: scale(0.95);
        }

        .toolbar-btn:hover, .toolbar-btn:focus-visible {
            background: var(--accent-light);
            color: var(--accent-primary);
            outline: none;
        }

        .toolbar-btn:focus-visible {
            box-shadow: 0 0 0 3px var(--accent-primary);
        }

        .toolbar-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .lesson-title {
            font-size: var(--font-sm);
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
            font-family: 'Playfair Display', serif;
        }

        .progress-ring {
            position: relative;
            width: 44px;
            height: 44px;
        }

        .progress-ring svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .progress-ring__circle {
            fill: none;
            stroke: var(--border-color);
            stroke-width: 3.5;
        }

        .progress-ring__progress {
            fill: none;
            stroke: var(--accent-primary);
            stroke-width: 3.5;
            stroke-linecap: round;
            transition: stroke-dashoffset var(--transition-normal);
            filter: drop-shadow(0 2px 4px rgba(200, 165, 46, 0.3));
        }

        .progress-ring__text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Playfair Display', serif;
        }

        /* ========================================
           MAIN CONTENT
           ======================================== */
        main {
            padding-top: calc(var(--toolbar-height) + 20px);
            padding-bottom: 32px;
            max-width: 100%;
        }

        .content-wrapper {
            padding: 0 20px;
            max-width: 760px;
            margin: 0 auto;
        }

        /* Hero section removed - will be added via JavaScript */

        /* ========================================
           HEADER
           ======================================== */
        .lesson-hero {
            margin-bottom: 20px;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .lesson-hero img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform var(--transition-slow);
        }

        .lesson-hero:hover img {
            transform: scale(1.01);
        }

        /* ========================================
           HEADER
           ======================================== */
        .lesson-header {
            text-align: center;
            padding: 28px 0 20px;
            margin-bottom: 28px;
            position: relative;
        }

        .lesson-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-coral));
            border-radius: 2px;
        }

        .lesson-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: var(--font-3xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            line-height: 1.25;
            letter-spacing: -0.02em;
        }

        .lesson-meta {
                    display: flex;
                    flex-wrap: wrap;
                    justify-content: center;
                    gap: 10px;
                    font-size: var(--font-sm);
                    color: var(--text-muted);
                    margin-top: 16px;
                }

                .meta-item {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    padding: 8px 16px;
                    background: var(--bg-tertiary);
                    border-radius: 100px;
                    border: 1px solid var(--border-color);
                    transition: all var(--transition-fast);
                }

                .meta-item:hover {
                    border-color: var(--accent-primary);
                    transform: translateY(-1px);
                }

                .meta-item svg {
                    width: 16px;
                    height: 16px;
                    stroke: var(--accent-primary);
                    flex-shrink: 0;
                }

                /* ========================================
                   SECTIONS (COLLAPSIBLE)
                   ======================================== */
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-normal);
        }

        .section:focus-within {
            box-shadow: var(--shadow-md);
            border-color: var(--accent-primary);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--bg-secondary) 100%);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            min-height: var(--tap-target);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .section-header:hover {
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--bg-tertiary) 100%);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: var(--font-xl);
            font-weight: 600;
            color: var(--text-primary);
            font-family: 'Playfair Display', serif;
        }

        .section-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent-primary) 100%);
            border-radius: var(--radius-md);
            color: var(--accent-primary);
            box-shadow: 0 4px 12px rgba(200, 165, 46, 0.25);
        }

        .section-icon svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
        }

        .section-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: var(--tap-target);
            height: var(--tap-target);
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-normal);
        }

        .section-toggle[aria-expanded="true"] {
            transform: rotate(180deg);
        }

        .section-toggle:hover, .section-toggle:focus-visible {
            color: var(--accent-primary);
            background: var(--accent-light);
        }

        .section-toggle:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-primary);
        }

        .section-toggle svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .section-content {
            padding: 24px;
            display: none;
            animation: slideDown var(--transition-normal) ease-out;
        }

        .section[open] .section-content {
            display: block;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========================================
           TYPOGRAPHY
           ======================================== */
        .section-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: var(--font-2xl);
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--accent-light);
            position: relative;
        }

        .section-content h2::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-coral));
            border-radius: 2px;
        }

        .section-content h3 {
            font-size: var(--font-lg);
            font-weight: 600;
            color: var(--text-primary);
            margin: 24px 0 14px;
        }

        .section-content p {
            margin-bottom: 18px;
            color: var(--text-secondary);
            font-size: var(--font-base);
            line-height: 1.8;
        }

        .section-content ul, .section-content ol {
            margin: 14px 0 18px 28px;
        }

        .section-content li {
            margin-bottom: 10px;
            color: var(--text-secondary);
            line-height: 1.75;
        }

        .section-content li::marker {
            color: var(--accent-primary);
            font-weight: 600;
        }

        .section-content a {
            color: var(--accent-teal);
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: all var(--transition-fast);
            padding-bottom: 2px;
            font-weight: 500;
        }

        .section-content a:hover, .section-content a:focus-visible {
            border-bottom-color: var(--accent-teal);
            color: var(--accent-coral);
        }

        .section-content a:focus-visible {
            outline: none;
            border-radius: 2px;
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .scripture-ref {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: var(--accent-light);
            color: var(--accent-primary);
            border-radius: 6px;
            font-size: var(--font-sm);
            font-weight: 600;
            margin: 0 2px;
            text-decoration: none;
            border: 1px solid var(--border-color);
            transition: all var(--transition-fast);
            white-space: nowrap;
        }

        .scripture-ref:hover {
            background: var(--accent-primary);
            color: var(--text-on-accent);
            border-color: var(--accent-primary);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(200, 165, 46, 0.3);
        }

        blockquote {
            border-left: 4px solid var(--accent-primary);
            padding: 16px 20px;
            margin: 20px 0;
            font-style: italic;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            position: relative;
        }

        blockquote::before {
            content: '"';
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            color: var(--accent-primary);
            opacity: 0.3;
            position: absolute;
            top: -10px;
            left: 10px;
            line-height: 1;
        }

        .callout {
            padding: 20px;
            border-radius: var(--radius-md);
            margin: 20px 0;
            border-left: 5px solid;
            position: relative;
            overflow: hidden;
        }

        .callout::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.1) 100%);
            pointer-events: none;
        }

        .callout-insight {
            background: linear-gradient(135deg, #eef7ff 0%, #dbeafe 100%);
            border-color: #3b82f6;
            color: #1e3a5f;
        }

        .callout-application {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border-color: #22c55e;
            color: #14532d;
        }

        .callout-promise {
            background: linear-gradient(135deg, #fefce8 0%, #fef3c7 100%);
            border-color: #eab308;
            color: #713f12;
        }

        [data-theme="dark"] .callout-insight {
            background: linear-gradient(135deg, #1e3a5f 0%, #1e4a7a 100%);
            color: #93c5fd;
        }

        [data-theme="dark"] .callout-application {
            background: linear-gradient(135deg, #14532d 0%, #166534 100%);
            color: #86efac;
        }

        [data-theme="dark"] .callout-promise {
            background: linear-gradient(135deg, #713f12 0%, #854d0e 100%);
            color: #fde047;
        }

        /* ========================================
           DEEP LINKS
           ======================================== */
        .deep-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        .deep-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 100px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: var(--font-sm);
            font-weight: 500;
            min-height: var(--tap-target);
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .deep-link:hover, .deep-link:focus-visible {
            background: var(--accent-light);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .deep-link:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .deep-link svg {
            width: 18px;
            height: 18px;
            stroke: var(--accent-primary);
            flex-shrink: 0;
        }

        /* ========================================
           REFLECTION INPUT (LOCALSTORAGE)
           ======================================== */
        .reflection-prompt {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px;
            margin: 20px 0;
        }

        .reflection-prompt label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            font-size: var(--font-sm);
        }

        .reflection-textarea {
            width: 100%;
            min-height: 120px;
            padding: 16px;
            font-family: inherit;
            font-size: var(--font-base);
            line-height: var(--line-height);
            color: var(--text-primary);
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            resize: vertical;
            transition: all var(--transition-fast);
        }

        .reflection-textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px var(--accent-light);
        }

        .reflection-textarea::placeholder {
            color: var(--text-muted);
        }

        .reflection-saved {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            margin-top: 12px;
            background: var(--accent-light);
            color: var(--accent-primary);
            border-radius: var(--radius-sm);
            font-size: var(--font-sm);
            font-weight: 500;
            animation: fadeIn 0.3s ease;
        }

        .reflection-saved.visible {
            display: flex;
        }

        .reflection-saved svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
        }

        .word-count {
            text-align: right;
            font-size: var(--font-sm);
            color: var(--text-muted);
            margin-top: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========================================
           NAVIGATION (TOC)
           ======================================== */
        .toc-overlay {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 340px;
            height: 100vh;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            transition: right var(--transition-normal);
            box-shadow: var(--shadow-xl);
        }

        .toc-overlay.open {
            right: 0;
        }

        .toc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            z-index: 1;
        }

        .toc-title {
            font-family: 'Playfair Display', serif;
            font-size: var(--font-xl);
            font-weight: 600;
            color: var(--text-primary);
        }

        .toc-close {
            width: var(--tap-target);
            height: var(--tap-target);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        .toc-close:hover, .toc-close:focus-visible {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
        }

        .toc-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .toc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            text-decoration: none;
            font-size: var(--font-base);
            font-weight: 500;
            min-height: var(--tap-target);
            transition: all var(--transition-fast);
            border: 1px solid transparent;
        }

        .toc-item:hover, .toc-item:focus-visible {
            background: var(--accent-light);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .toc-item:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .toc-item .toc-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-color);
            flex-shrink: 0;
            transition: all var(--transition-fast);
        }

        .toc-item.active .toc-indicator {
            background: var(--accent-primary);
        }

        .toc-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1999;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-normal);
        }

        .toc-backdrop.visible {
            opacity: 1;
            visibility: visible;
        }

           PRINT STYLES (PDF OUTPUT)
           ======================================== */

                display: none !important;
            }

            body {
                background: white !important;
                color: #1d3a4a !important;
                padding: 0;
                font-size: 12pt;
                line-height: 1.6;
            }

            main {
                padding-top: 0;
            }

            .content-wrapper {
                padding: 0;
                max-width: none;
            }

            .lesson-hero {
                page-break-after: avoid;
                box-shadow: none;
            }

            .lesson-header {
                page-break-after: avoid;
                border-bottom: 3px solid #c8962e;
                padding: 40px 0;
            }

            .lesson-header h1 {
                font-size: 28pt;
                color: #1d3a4a;
            }

            .section {
                break-inside: avoid;
                page-break-inside: avoid;
                border: 1px solid #e5dbc8;
                box-shadow: none;
                margin-bottom: 28px;
            }

            .section-header {
                background: #f0ebe0 !important;
                border-bottom: 1px solid #e5dbc8;

                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .section-content {
                display: block !important;
                padding: 24px;
            }

            .section-content h2 {
                font-size: 16pt;
                color: #2d5a6e;
            }

            .callout {
                break-inside: avoid;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .scripture-ref {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .deep-links {
                display: none;
            }

            .lesson-meta {
                display: none;
            }

            .toolbar, .section-toggle, .reflection-textarea {
                display: none !important;
            }
        }

            padding: 32px 0 20px;

            transition: color var(--transition-fast);
        }

        .footer-links a:hover {
            color: var(--accent-coral);

        /* ========================================
           JAVASCRIPT
           ======================================== */
        <script>
            (function() {
                'use strict';

                // ========================================
                // STATE MANAGEMENT
                // ========================================
                const state = {
                    theme: 'light',
                    sections: ['scripture', 'commentary', 'reflection', 'application'],
                    reflections: {},
                    scrollProgress: 0
                };

                const STORAGE_KEY = 'cfm_study_guide_';
                const LESSON_ID = '[LESSON_ID]'; // Will be replaced by Helios

                // ========================================
                // DOM ELEMENTS
                // ========================================
                const elements = {
                    html: document.documentElement,
                    themeToggle: document.getElementById('theme-toggle'),
                    themeIconSun: document.querySelector('.icon-sun'),
                    themeIconMoon: document.querySelector('.icon-moon'),
                    tocToggle: document.getElementById('toc-toggle'),
                    tocOverlay: document.getElementById('toc-overlay'),
                    tocBackdrop: document.getElementById('toc-backdrop'),
                    tocClose: document.getElementById('toc-close'),
                    tocList: document.getElementById('toc-list'),
                    printBtn: document.getElementById('print-btn'),
                    progressRing: document.querySelector('.progress-ring__progress'),
                    progressText: document.querySelector('.progress-ring__text'),
                    toolbarTitle: document.getElementById('toolbar-title'),
                    reflectionTextareas: document.querySelectorAll('.reflection-textarea'),
                    reflectionSaved: document.querySelectorAll('.reflection-saved'),
                    wordCounts: document.querySelectorAll('.word-count'),
                    sections: document.querySelectorAll('.section')
                };

                const CIRCUMFERENCE = 2 * Math.PI * 18; // 113.1

                // ========================================
                // INITIALIZATION
                // ========================================
                function init() {
                    loadTheme();
                    loadReflections();
                    buildTOC();
                    setupEventListeners();
                    updateProgress();
                    updateToolbarTitle();
                    
                    // Handle hash navigation
                    if (window.location.hash) {
                        const hash = window.location.hash.slice(1);
                        if (hash.startsWith('section-')) {
                            const section = document.getElementById(hash);
                            if (section) {
                                section.setAttribute('open', '');
                                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                                updateActiveTOC(hash.replace('section-', ''));
                            }
                        }
                    }
                }

                // ========================================
                // THEME MANAGEMENT
                // ========================================
                function loadTheme() {
                    const saved = localStorage.getItem('cfm_theme');
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    state.theme = saved || (prefersDark ? 'dark' : 'light');
                    applyTheme(state.theme);
                }

                function applyTheme(theme) {
                    state.theme = theme;
                    elements.html.setAttribute('data-theme', theme);
                    localStorage.setItem('cfm_theme', theme);
                    updateThemeIcons();
                }

                function updateThemeIcons() {
                    const isDark = state.theme === 'dark';
                    elements.themeIconSun.style.display = isDark ? 'block' : 'none';
                    elements.themeIconMoon.style.display = isDark ? 'none' : 'block';
                    elements.themeToggle.setAttribute('aria-pressed', isDark);
                    elements.themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
                }

                function toggleTheme() {
                    applyTheme(state.theme === 'light' ? 'dark' : 'light');
                }

                // ========================================
                // REFLECTION LOCALSTORAGE
                // ========================================
                function loadReflections() {
                    const key = STORAGE_KEY + LESSON_ID;
                    try {
                        const saved = localStorage.getItem(key);
                        if (saved) {
                            state.reflections = JSON.parse(saved);
                            elements.reflectionTextareas.forEach((textarea, i) => {
                                const id = textarea.id;
                                if (state.reflections[id]) {
                                    textarea.value = state.reflections[id];
                                    updateWordCount(textarea, elements.wordCounts[i]);
                                    showSavedIndicator(elements.reflectionSaved[i]);
                                }
                            });
                        }
                    } catch (e) {
                        console.warn('Failed to load reflections:', e);
                    }
                }

                function saveReflection(textarea) {
                    const id = textarea.id;
                    state.reflections[id] = textarea.value;
                    const key = STORAGE_KEY + LESSON_ID;
                    try {
                        localStorage.setItem(key, JSON.stringify(state.reflections));
                    } catch (e) {
                        console.warn('Failed to save reflection:', e);
                    }
                }

                function updateWordCount(textarea, wordCountEl) {
                    const text = textarea.value.trim();
                    const count = text ? text.split(/\s+/).length : 0;
                    wordCountEl.textContent = `${count} word${count !== 1 ? 's' : ''}`;
                }

                function showSavedIndicator(el) {
                    el.classList.add('visible');
                    clearTimeout(el._hideTimer);
                    el._hideTimer = setTimeout(() => el.classList.remove('visible'), 2500);
                }

                function handleReflectionInput(e) {
                    const textarea = e.target;
                    const index = Array.from(elements.reflectionTextareas).indexOf(textarea);
                    updateWordCount(textarea, elements.wordCounts[index]);
                    saveReflection(textarea);
                    showSavedIndicator(elements.reflectionSaved[index]);
                }

                // ========================================
                // TABLE OF CONTENTS
                // ========================================
                function buildTOC() {
                    elements.tocList.innerHTML = '';
                    state.sections.forEach((sectionId, index) => {
                        const section = document.getElementById(`section-${sectionId}`);
                        if (!section) return;

                        const titleEl = section.querySelector('.section-title');
                        if (!titleEl) return;

                        const title = titleEl.textContent.trim();
                        const link = document.createElement('a');
                        link.href = `#section-${sectionId}`;
                        link.className = 'toc-item';
                        link.dataset.section = sectionId;
                        link.setAttribute('role', 'option');
                        link.setAttribute('aria-selected', 'false');
                        link.innerHTML = `<span>${title}</span><span class="toc-indicator" aria-hidden="true"></span>`;
                        link.addEventListener('click', (e) => {
                            e.preventDefault();
                            closeTOC();
                            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            updateActiveTOC(sectionId);
                        });
                        elements.tocList.appendChild(link);
                    });
                }

                function updateActiveTOC(activeId) {
                    document.querySelectorAll('.toc-item').forEach(item => {
                        const isActive = item.dataset.section === activeId;
                        item.classList.toggle('active', isActive);
                        item.setAttribute('aria-selected', isActive);
                    });
                }

                function openTOC() {
                    elements.tocOverlay.classList.add('open');
                    elements.tocBackdrop.classList.add('visible');
                    elements.tocToggle.setAttribute('aria-expanded', 'true');
                    document.body.style.overflow = 'hidden';
                }

                function closeTOC() {
                    elements.tocOverlay.classList.remove('open');
                    elements.tocBackdrop.classList.remove('visible');
                    elements.tocToggle.setAttribute('aria-expanded', 'false');
                    document.body.style.overflow = '';
                }

                function toggleTOC() {
                    if (elements.tocOverlay.classList.contains('open')) {
                        closeTOC();
                    } else {
                        openTOC();
                    }
                }

                // ========================================
                // SCROLL PROGRESS
                // ========================================
                function updateProgress() {
                    const scrollTop = window.scrollY;
                    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                    state.scrollProgress = docHeight > 0 ? scrollTop / docHeight : 0;
                    const offset = CIRCUMFERENCE * (1 - state.scrollProgress);
                    elements.progressRing.style.strokeDashoffset = offset;
                    elements.progressText.textContent = `${Math.round(state.scrollProgress * 100)}%`;
                }

                function updateToolbarTitle() {
                    const titleEl = document.getElementById('lesson-title');
                    if (titleEl) {
                        elements.toolbarTitle.textContent = titleEl.textContent;
                    }
                }

                // ========================================
                // SECTION TOGGLE
                // ========================================
                function setupSectionToggles() {
                    document.querySelectorAll('.section-toggle').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const section = btn.closest('.section');
                            const isOpen = section.hasAttribute('open');
                            if (isOpen) {
                                section.removeAttribute('open');
                                btn.setAttribute('aria-expanded', 'false');
                            } else {
                                section.setAttribute('open', '');
                                btn.setAttribute('aria-expanded', 'true');
                            }
                            updateProgress();
                        });
                    });
                }

                // ========================================
                // EVENT LISTENERS
                // ========================================
                function setupEventListeners() {
                    // Theme toggle
                    elements.themeToggle.addEventListener('click', toggleTheme);

                    // TOC
                    elements.tocToggle.addEventListener('click', toggleTOC);
                    elements.tocClose.addEventListener('click', closeTOC);
                    elements.tocBackdrop.addEventListener('click', closeTOC);

                    // Print
                    elements.printBtn.addEventListener('click', () => window.print());

                    // Reflections
                    elements.reflectionTextareas.forEach(textarea => {
                        textarea.addEventListener('input', handleReflectionInput);
                    });

                    // Section toggles
                    setupSectionToggles();

                    // Scroll progress
                    let scrollTimeout;
                    window.addEventListener('scroll', () => {
                        if (scrollTimeout) cancelAnimationFrame(scrollTimeout);
                        scrollTimeout = requestAnimationFrame(updateProgress);
                    }, { passive: true });

                    // Keyboard: Escape closes TOC
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && elements.tocOverlay.classList.contains('open')) {
                            closeTOC();
                        }
                    });

                    // IntersectionObserver for active TOC item
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
                                updateActiveTOC(entry.target.id.replace('section-', ''));
                            }
                        });
                    }, { rootMargin: '-20% 0px -60% 0px', threshold: [0, 0.5, 1] });

                    elements.sections.forEach(section => observer.observe(section));

                    // Handle hash navigation
                    window.addEventListener('hashchange', () => {
                        const hash = window.location.hash.slice(1);
                        if (hash.startsWith('section-')) {
                            const section = document.getElementById(hash);
                            if (section) {
                                section.setAttribute('open', '');
                                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                                updateActiveTOC(hash.replace('section-', ''));
                            }
                        }
                    });
                }

                // ========================================
                // DEEP LINK INJECTION HELPER (for Helios)
                // ========================================
                window.CFMTemplate = {
                    setLessonData: function(data) {
                        // Update title
                        document.getElementById('lesson-title').textContent = data.title || '[LESSON_TITLE]';
                        document.getElementById('toolbar-title').textContent = data.title || '[LESSON_TITLE]';

                        // Update meta
                        document.getElementById('meta-date').querySelector('span:last-child').textContent = data.weekDate || '[WEEK_DATE]';
                        document.getElementById('meta-scripture').querySelector('span:last-child').textContent = data.scriptures || '[SCRIPTURE_REFERENCES]';

                        // Update content sections
                        if (data.scripture) document.getElementById('scripture-body').innerHTML = data.scripture;
                        if (data.commentary) document.getElementById('commentary-body').innerHTML = data.commentary;
                        if (data.application) document.getElementById('application-body').innerHTML = data.application;

                        // Update deep links
                        function renderLinks(containerId, links) {
                            const container = document.getElementById(containerId);
                            if (!container || !links?.length) return;
                            container.innerHTML = links.map(link => `
                                <a href="${link.url}" class="deep-link" target="_blank" rel="noopener" role="listitem">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                        <polyline points="15 3 21 3 21 9"></polyline>
                                        <line x1="10" y1="14" x2="21" y2="3"></line>
                                    </svg>
                                    ${link.label}
                                </a>
                            `).join('');
                        }

                        renderLinks('scripture-links', data.scriptureLinks);
                        renderLinks('commentary-links', data.commentaryLinks);
                        renderLinks('application-links', data.applicationLinks);

                        // Update lesson ID for localStorage
                        if (data.lessonId) {
                            LESSON_ID = data.lessonId;
                            loadReflections();
                        }

                        // Rebuild TOC after content injection
                        buildTOC();
                    },

                    getReflections: function() {
                        return { ...state.reflections };
                    },

                    clearReflections: function() {
                        state.reflections = {};
                        const key = STORAGE_KEY + LESSON_ID;
                        localStorage.removeItem(key);
                        elements.reflectionTextareas.forEach((textarea, i) => {
                            textarea.value = '';
                            updateWordCount(textarea, elements.wordCounts[i]);
                            elements.reflectionSaved[i].classList.remove('visible');
                        });
                    }
                };

                // Initialize when DOM ready
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', init);
                } else {
                    init();
                }
            })();
        </script>

": "<h2>Key Themes</h2><ul><li><strong>Universal praise</strong> \u2014 Psalms 146\u2013150 form the final doxology of the Psalter, each beginning and ending with \"Hallelujah.\"</li><li><strong>God's mercy and deliverance</strong> \u2014 Psalm 103:8\u201314, one of the clearest Old Testament statements of divine compassion.</li><li><strong>Messianic prophecy</strong> \u2014 <a href=\"https://www.churchofjesuschrist.org/study/scriptures/ot/ps/110?lang=eng&id=p1\" class=\"scripture-ref\" target=\"_blank\" rel=\"noopener\">Psalm 110:1</a>, the most-quoted OT verse in the NT, points to Christ's exaltation.</li><li><strong>Delight in God's word</strong> \u2014 Psalm 119's 176 verses celebrate Torah as guidance, joy, and life.</li><li><strong>God as refuge and strength</strong> \u2014 Psalm 103, 116, 138: God hears, delivers, and preserves.</li><li><strong>Family and covenant blessings</strong> \u2014 Psalms 127\u2013128 on building houses and families with the Lord at the center.</li><li><strong>Omniscience and omnipresence</strong> \u2014 Psalm 139: nowhere we can go is outside God's reach.</li></ul><h2>Scholarly Insights</h2><p><strong>BYU Studies (Psalms, Part 2):</strong> The fivefold division of the Psalter mirrors the Torah; Book 5 (107\u2013150) emphasizes return from exile and temple worship.</p><p><strong>followHIM Podcast (Dr. Joshua Sears):</strong> Psalm 119's acrostic structure \u2014 22 stanzas \u00d7 8 verses = 176 verses, each stanza beginning with successive Hebrew letters. A masterpiece of literary architecture.</p><p><strong>Scripture Insights (Taylor Halverson):</strong> Songs of Ascents were likely sung on the 15 steps between the Court of Women and Court of Israel in the temple \u2014 one psalm per step.</p>", "application": "<h2>Personal Application</h2><div class=\"callout callout-application\"><strong>This Week:</strong> Choose one psalm to memorize or pray through daily. Let its language shape your own prayers.</div><h2>Action Items</h2><ol><li
